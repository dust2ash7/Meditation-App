<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Meditation Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
</head>
<body>
    <div class="container">
        <h1>Meditation Timer</h1>
        <p>Set your session time and relax.</p>
        <input type="number" id="minutes" min="1" max="60" value="10" placeholder="Minutes (1-60)">
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
        <div id="timer">10:00</div>
        <audio id="bell" src="https://www.soundjay.com/buttons/bell-sound.mp3"></audio> <!-- Free public sound -->
        <!-- Existing bell audio -->
<audio id="bell" src="https://www.soundjay.com/buttons/bell-sound.mp3"></audio>

<!-- New: Background music (looping) -->
<audio id="bgMusic" loop>
    <source src="https://github.com/dust2ash7/Meditation-App/blob/main/nastelbom-meditation.mp3.mp3" type="audio/mpeg">  <!-- Change to your file name or full URL -->
    Your browser does not support the audio element.
</audio>

<!-- Music toggle button (optional but recommended) -->
<button id="musicToggle">Music: On</button>

        <!-- Add Buy Me a Coffee Button Here -->
<a href="https://www.buymeacoffee.com/nrsteward" target="_blank">
    <img src="https://cdn.buymeacoffee.com/buttons/v2/default-orange.png" alt="Buy Me a Coffee" style="height: 60px !important; width: 217px !important;">
</a>
    </div>
    <script src="script.js"></script>
    <script src="sw.js"></script>
</body>
</html>
